  # /my/notifications — crowdin оставил EN в description; термины Пульса
  my_account:
    notifications_and_email:
      title: Уведомления и email
      tabs:
        notifications: Настройки уведомлений
        email_reminders: Почтовые напоминания
    notifications:
      participating:
        title: Участие
        description: >-
          Вы всегда получаете уведомление при упоминании и об изменениях ковенант,
          за которыми следите — это нельзя отключить. Дополнительно можно включить
          уведомления по ковенантам, где вы исполнитель, ответственный или вам дали доступ.
        submit_button: Сохранить
        mentioned: Упомянули
        watched: Наблюдаю
        assignee: Исполнитель
        responsible: Ответственный
        shared: Доступно мне
      date_alerts:
        title: Оповещения по датам
        description: >-
          Оповещения о приближающихся или просроченных сроках по ковенантам,
          где вы исполнитель, ответственный или наблюдатель.
        submit_button: Сохранить
        start_date: Дата начала
        due_date: Дата окончания
        overdue: Просрочено
        times:
          same_day: В тот же день
          one_day_before: За 1 день
          three_days_before: За 3 дня
          seven_days_before: За 7 дней
          one_day_after: Через 1 день
          three_days_after: Через 3 дня
          seven_days_after: Через 7 дней
      non_participating:
        title: Все ковенанты
        description: >-
          Дополнительно можно получать уведомления о событиях во всех предприятиях,
          даже если вы не участвуете в ковенанте.
        submit_button: Сохранить
        work_package_created: Новые ковенанты
        work_package_commented: Все новые комментарии
        work_package_processed: Все изменения статуса
        work_package_prioritized: Все изменения приоритета
        work_package_scheduled: Все изменения дат
      project_specific_settings:
        title: Уведомления по предприятию
        description: >-
          Можно настроить отдельные правила для конкретного предприятия.
          Эти настройки перекрывают общие выше.
        add_button: Добавить уведомления по предприятию
        dialog_title: Уведомления по предприятию
        list_header: Предприятия с особыми уведомлениями
    email_reminders:
      immediate_reminders:
        title: Отправлять мне письмо сразу
        mentioned: Когда меня упоминают
        personal_reminder: По личным напоминаниям
      daily_reminders:
        title: Ежедневные письма о непрочитанных уведомлениях
        description: >-
          Письма только по непрочитанным уведомлениям и только в указанные часы.
          Пока не задан часовой пояс учётной записи, время считается в UTC.
        enabled: Включить ежедневные напоминания
        add_time: Добавить время
        remove_time: Удалить время
        time_slot_label: Время напоминания (UTC)
      workdays:
        title: Дни для почтовых напоминаний
        submit_button: Сохранить дни
      pause_reminders:
        title: Пауза почтовых уведомлений
        enabled: Временно приостановить ежедневные напоминания
        date_range: Период паузы
